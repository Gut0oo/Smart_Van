name: smartvan

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartvan
      POSTGRES_USER: smartvan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  backend:
    image: smartvan-backend:${IMAGE_TAG:-faculdade-v1}
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smartvan
      DB_USERNAME: smartvan
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  frontend:
    image: smartvan-frontend:${IMAGE_TAG:-faculdade-v1}
    build:
      context: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: unless-stopped

volumes:
  postgres-data:
