spring:
  application:
    name: SmartVan

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartvan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Password123!}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

smartvan:
  agendador:
    habilitado: true   # liga os @Scheduled (AgendadorConfig); nos testes fica false
    mensalidades:
      cron: "0 0 6 * * *"   # todo dia às 06:00, fuso de São Paulo
  mensalidade:
    dia-vencimento: 10   # de 1 a 28; fora disso a aplicação não sobe
  rota:
    margem-chegada-minutos: 15   # teto de chegada à escola = início da aula - margem
