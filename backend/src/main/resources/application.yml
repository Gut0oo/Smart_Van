spring:
  application:
    name: SmartVan

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartvan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}   # sem valor padrão: sem a variável, a aplicação não sobe (BancoConfig)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

smartvan:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:8081,http://localhost:19006}   # app web (Expo) em desenvolvimento
  agendador:
    habilitado: true   # liga os @Scheduled (AgendadorConfig); nos testes fica false
    mensalidades:
      cron: "0 0 6 * * *"   # todo dia às 06:00, fuso de São Paulo
    cancelamentos:
      cron: "0 30 6 * * *"   # todo dia às 06:30, fuso de São Paulo
  rota:
    margem-chegada-minutos: 15   # teto de chegada à escola = início da aula - margem
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}   # vazia: sem Google, a rota usa o plano B por proximidade
