spring:
  datasource:
    url: jdbc:h2:mem:smartvan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

smartvan:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:8081,http://localhost:19006}   # app web (Expo) em desenvolvimento
  agendador:
    habilitado: false  # os testes chamam os jobs direto
    mensalidades:
      cron: "0 0 6 * * *"
    cancelamentos:
      cron: "0 30 6 * * *"
