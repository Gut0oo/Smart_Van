spring:
  datasource:
    url: jdbc:h2:mem:smartvan;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

smartvan:
  agendador:
    habilitado: false  # os testes chamam os jobs direto
